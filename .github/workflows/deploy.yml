name: deploy

# The site is static on GitHub Pages. It is built on every push to main, by
# hand, and every day - the modules catalog is the registry's modules.json
# and npm's versions at build time, so the daily build is what brings new
# modules in.
#
# The docs are not in this repository: Nuxt Content reads the framework's
# docs/ from github.com/amxts/amxts, the catalog from github.com/amxts/modules
# and each listed module's READMEs from its repository while it builds
# (content.config.ts), so the build takes whatever their main branches have.
# A push there does not start this workflow; the daily build or a run by hand
# brings it in.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate
        run: bun run generate
        env:
          # '/' for amxts.github.io; a project page would be /<repo>/
          NUXT_APP_BASE_URL: ${{ steps.pages.outputs.base_path }}/
          # the origin only: the site's modules add the base path themselves
          NUXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.origin }}

      - name: Upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
